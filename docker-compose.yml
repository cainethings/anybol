services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - mysql

  php-fpm:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile.php
    volumes:
      - ./apps/api:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql

  nginx:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile.nginx
    ports:
      - "${NGINX_PORT:-8081}:8081"
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html
      - ./apps/api:/var/www/html:ro
    depends_on:
      - php-fpm
      - mysql
